<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabby AI</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:15px;max-width:700px;margin:auto}
#chat{height:55vh;overflow-y:auto;background:#020617;padding:15px;border-radius:12px;margin-bottom:12px}
.msg{margin-bottom:12px;line-height:1.5}
.user{color:#93c5fd}
.tabby{color:#86efac}
input{width:75%;padding:12px;border-radius:8px;border:none}
button{padding:12px 16px;border:none;border-radius:8px;background:#3b82f6;color:white;font-weight:bold}
</style>
</head>
<body>
<h2 style="text-align:center">Tabby AI</h2>
<p style="text-align:center;color:#94a3b8">Ask me anything</p>
<div id="chat"><div class="msg tabby"><b>Tabby:</b> Yo! I'm active now. Ask me anything.</div></div>
<div style="display:flex;gap:8px">
<input id="msg" placeholder="Type your question...">
<button onclick="send()">Send</button>
</div>
<script>
async function send(){
let inp=document.getElementById('msg');
let m=inp.value.trim();
if(!m) return;
let c=document.getElementById('chat');
c.innerHTML+='<div class="msg user"><b>You:</b> '+m+'</div>';
inp.value='';
c.innerHTML+='<div class="msg tabby" id="loading"><b>Tabby:</b> typing...</div>';
let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
let d=await r.json();
document.getElementById('loading').remove();
c.innerHTML+='<div class="msg tabby"><b>Tabby:</b> '+d.reply.replace(/\n/g,'<br>')+'</div>';
c.scrollTop=c.scrollHeight;
}
document.getElementById('msg').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
</script>
</body>
</html>
