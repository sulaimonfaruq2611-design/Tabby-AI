<!DOCTYPE html>
<html>
<head>
<title>Tabby Smart E-Bike Brain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0f172a;color:white;font-family:Arial;margin:0;padding:15px}
h1{text-align:center;font-size:22px;margin-bottom:2px}
p{text-align:center;color:#94a3b8;font-size:13px}
#chat{max-width:600px;margin:20px auto;background:#1e293b;padding:15px;border-radius:15px;min-height:300px;overflow-y:auto}
.msg{margin:10px 0;padding:10px;border-radius:10px}
.user{background:#2563eb;text-align:right}
.tabby{background:#334155}
#box{max-width:600px;margin:auto;display:flex;gap:6px;flex-wrap:wrap}
input{flex:1;padding:12px;border-radius:10px;border:none;outline:none;min-width:150px}
button{padding:12px 12px;border-radius:10px;border:none;background:#22c55e;color:white;font-weight:bold;cursor:pointer}
#micBtn{background:#eab308}
#voiceBtn{background:#a855f7}
.status{text-align:center;font-size:12px;color:#22c55e}
</style>
</head>
<body>
<h1>Tabby Smart E-Bike Brain</h1>
<p>Created by Faruq, JARVIS for your e-bike.<br>Ask: Can I reach Ikeja? Battery status?</p>
<p class="status" id="status">● Ready</p>
<div id="chat"><div class="msg tabby">Hello Boss! I'm Tabby. Ask me about your e-bike.</div></div>
<div id="box">
<input id="input" placeholder="Ask Tabby..." />
<button onclick="send()">Send</button>
<button id="micBtn" onclick="startMic()">🎤</button>
<button id="voiceBtn" onclick="toggleVoice()">Hey Tabby: OFF</button>
</div>
<script>
let listening=false, recognition;
function addMsg(t,w){let c=document.getElementById('chat');let d=document.createElement('div');d.className='msg '+w;d.innerText=t;c.appendChild(d);c.scrollTop=c.scrollHeight}
function speak(t){let u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u)}
async function send(textFromVoice){
let inp=document.getElementById('input');let text=textFromVoice||inp.value;if(!text)return;
addMsg(text,'user');inp.value='';
try{let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,conversation_id:'default'})});
let d=await r.json();addMsg(d.reply||d.error,'tabby');speak(d.reply||d.error);}catch(e){addMsg('Connection error. Try again.','tabby')}
}
function startMic(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Use Chrome for voice');return}
recognition=new SR();recognition.lang='en-US';
recognition.onresult=(e)=>{send(e.results[0][0].transcript)};recognition.start();
document.getElementById('status').innerText='● Listening...';
setTimeout(()=>{document.getElementById('status').innerText='● Ready'},4000);
}
function toggleVoice(){
let btn=document.getElementById('voiceBtn');
if(!listening){listening=true;btn.innerText='Hey Tabby: ON';btn.style.background='#22c55e';listenForHeyTabby();}
else{listening=false;btn.innerText='Hey Tabby: OFF';btn.style.background='#a855f7';if(recognition)recognition.stop();}
}
function listenForHeyTabby(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
recognition=new SR();recognition.continuous=true;recognition.lang='en-US';
recognition.onresult=(e)=>{let t=e.results[e.results.length-1][0].transcript.toLowerCase();if(t.includes('hey tabby')){speak('Yes boss, I am listening');addMsg('Hey Tabby','user');addMsg('Yes boss, I am listening. What do you need?','tabby');setTimeout(()=>startMic(),1500)}};
recognition.onend=()=>{if(listening)recognition.start()};recognition.start();
}
document.getElementById('input').addEventListener('keypress',(e)=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
